# configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: video-se-config
  namespace: video-se
data:
  # Device selection (auto uses CUDA if available)
  ML_DEVICE: "auto"

  # LLM provider & models
  LLM_PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-1.5-flash"
  OLLAMA_HOST: "http://ollama"          # only if you deploy it later
  OLLAMA_PORT: "11434"
  OLLAMA_MODEL: "gemma:2b"

  # Networking between services (K8s service DNS names)
  API_HOST: "api"
  API_PORT: "1234"
  SEARCH_API_TIMEOUT_SECONDS: "10"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "video_search_engine"

  # UI binding (pods should bind to all interfaces)
  UI_HOST: "0.0.0.0"
  UI_PORT: "5050"

  # Filesystem layout (PVC mount points)
  OUTPUT_DIR: "/data/processed"
  VIDEO_DATA_PATH: "/data/videos"
  MODEL_CACHE_DIR: "/models"

  # Speaker-ID step decoupled in K8s
  SPEAKER_UI_MODE: "external"
  SPEAKER_MAP_TIMEOUT_SECONDS: "3600"

  # Queue settings. RABBITMQ_URL belongs in video-se-secrets because it contains credentials.
  INGESTION_QUEUE: "video.ingestion"

  # Model caches (mount a small PVC here for warm starts).
  # TRANSFORMERS_CACHE was removed in favor of HF_HOME — both transformers
  # and sentence-transformers honor HF_HOME, and emitting both produced
  # a FutureWarning on every import.
  HF_HOME: "/models/hf"
  SENTENCE_TRANSFORMERS_HOME: "/models/hf"
  TORCH_HOME: "/models/torch"

  # Runtime log verbosity for setup_logging-aware entrypoints
  # (CRITICAL/ERROR/WARNING/INFO/DEBUG). Defaults to INFO if unset/unknown.
  LOG_LEVEL: "INFO"

  # Log output format. `pretty` is colorized human-readable; `json` emits
  # one JSON object per line for log shippers (Loki, ELK, Datadog).
  # Production deployments should set this to `json`.
  LOG_FORMAT: "pretty"

  # Optional security knobs — uncomment and populate to enable.
  # SEARCH_API_KEY belongs in video-se-secrets (never the ConfigMap).
  # CORS_ALLOW_ORIGINS: "https://app.example.com"
  # MAX_REQUEST_BODY_BYTES: "32768"
  # RATE_LIMIT_PER_MINUTE: "120"

name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: make install-dev
      - name: Run validation
        run: make validate
      - name: Smoke-run benchmarks
        run: make bench-smoke

  compose-smoke:
    # Brings up the lighter half of the compose stack (chroma + rabbitmq +
    # api + ui-search) and asserts the API actually responds. The chroma
    # healthcheck regression that broke the API container's `depends_on`
    # gate would not have been caught by `docker compose config`; this job
    # would have caught it.
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Render env
        run: cp .env.example .env
      - name: Build and start services
        run: |
          docker compose --env-file .env up -d --build chroma rabbitmq api ui-search
      - name: Wait for healthy api
        run: |
          for i in $(seq 1 30); do
            # Look the container up through compose: its name depends on the
            # checkout directory, which follows the repository name.
            cid=$(docker compose --env-file .env ps -q api)
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
            echo "api health (attempt $i): $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file .env logs api chroma rabbitmq
          exit 1
      - name: Probe API endpoints
        run: |
          curl -fsS http://127.0.0.1:1234/healthz
          echo
          curl -fsS http://127.0.0.1:1234/readyz
          echo
          # Empty collection should return an empty list, not a 500.
          curl -fsS -X POST http://127.0.0.1:1234/search \
               -H 'Content-Type: application/json' \
               -d '{"query":"smoke test","top_k":3}'
      - name: Run real-Chroma integration tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt -r requirements-api.txt
          .venv/bin/python -m pytest tests/integration -v
        env:
          CHROMA_HOST: 127.0.0.1
          CHROMA_PORT: "8000"
      - name: Tear down
        if: always()
        run: docker compose --env-file .env down -v
